name: Verify OneNotify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python3 scripts/check-repo.py
      - run: mvn -B -f services/backend/pom.xml test spotless:check
      - run: npm ci
        working-directory: apps/web
      - run: npm run format:check && npm run lint && npm run typecheck && npm test && npm run build
        working-directory: apps/web
      - run: python3 scripts/check-staging.py --env-file .env.staging.example --structure-only
      - run: docker compose up -d --build --wait
      - run: node scripts/integration.mjs && node scripts/security-extra.mjs && node scripts/manual-lifecycle.mjs
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/web
      - run: python3 scripts/restore-drill.py
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
