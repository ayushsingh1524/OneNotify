name: onenotify
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onenotify}
      POSTGRES_USER: ${POSTGRES_USER:-onenotify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-database-change-me}
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U onenotify"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-onenotify}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-storage-change-me}
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  backend:
    build: ./services/backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-onenotify}
      POSTGRES_USER: ${POSTGRES_USER:-onenotify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-database-change-me}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:19092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-onenotify}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-storage-change-me}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-64-character-signing-secret-before-deployment}
      VAULT_KEY: ${VAULT_KEY:-MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      DEMO_EMAIL: ${DEMO_EMAIL:-family@example.test}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Family-demo-2026!}
      MALWARE_SCANNER: ${MALWARE_SCANNER:-demo}
      CLAMAV_HOST: ${CLAMAV_HOST:-localhost}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-support@onenotify.test}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      minio: {condition: service_healthy}
      mailpit: {condition: service_started}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
  frontend:
    build: ./apps/web
    environment:
      BACKEND_URL: http://backend:8080
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
