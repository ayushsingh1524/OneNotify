# Requires Docker Compose >= 2.24.4. Use a NEW project/volume set, never the demo database.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    volumes:
      - ./infra/staging/init-runtime-role.sh:/docker-entrypoint-initdb.d/20-runtime-role.sh:ro
    environment:
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set runtime database password}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
  redis:
    ports: !reset []
    restart: unless-stopped
  kafka:
    ports: !reset []
    restart: unless-stopped
    environment:
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  minio:
    ports: !reset []
    restart: unless-stopped
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a unique storage password}
  mailpit:
    profiles: [local-mail-only]
    ports: !reset []
  backend:
    ports: !reset []
    restart: unless-stopped
    environment:
      POSTGRES_USER: onenotify_runtime
      POSTGRES_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set runtime database password}
      MIGRATION_USER: ${POSTGRES_USER:-onenotify}
      MIGRATION_PASSWORD: ${POSTGRES_PASSWORD:?Set migration database password}
      DEMO_ENABLED: 'false'
      SECURE_COOKIE: 'true'
      APP_ORIGIN: https://${STAGING_DOMAIN:?Set staging hostname}
      JWT_SECRET: ${JWT_SECRET:?Set random signing secret}
      VAULT_KEY: ${VAULT_KEY:?Set random base64 vault key}
      MALWARE_SCANNER: clamav
      CLAMAV_HOST: clamav
      MAIL_HOST: ${MAIL_HOST:?Set SMTP host}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set SMTP username}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set SMTP password}
      MAIL_FROM: ${MAIL_FROM:?Set verified sender}
      MAIL_AUTH: 'true'
      MAIL_STARTTLS: 'true'
    depends_on: !override
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      minio: {condition: service_healthy}
      clamav: {condition: service_healthy}
  frontend:
    ports: !reset []
    restart: unless-stopped
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes: [clamav-data:/var/lib/clamav]
    mem_limit: 4g
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?Set staging hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set certificate contact email}
      STAGING_ALLOWED_CIDR: ${STAGING_ALLOWED_CIDR:?Set tester public IP/CIDR}
    volumes:
      - ./infra/staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend: {condition: service_healthy}
volumes:
  clamav-data:
  caddy-data:
  caddy-config:
